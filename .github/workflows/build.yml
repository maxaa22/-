name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Find project
        run: |
          Z=$(ls *.zip 2>/dev/null | head -1)
          [ -n "$Z" ] && unzip -oq "$Z"
          D=$(dirname $(find . -name settings.gradle -not -path "*/node_modules/*" | head -1))
          echo "PROJ=$D" >> $GITHUB_ENV
      - name: Build
        run: cd "$PROJ" && gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Hub-apk
          path: ${{ env.PROJ }}/app/build/outputs/apk/release/*.apk
